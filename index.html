
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Manage your money. Control your future.</p>
    </header>

    <main class="container">

        <section class="budget-section">
            <h2>Set Your Monthly Budget</h2>
            <input type="number" id="budgetInput"
                   placeholder="Enter your budget">
            <button id="setBudgetBtn">Set Budget</button>
        </section>

        <section class="summary-cards">
            <div class="card">
                <h3>Total Budget</h3>
                <p id="budgetDisplay">Ksh. 0</p>
            </div>

            <div class="card">
                <h3>Total Spent</h3>
                <p id="totalDisplay">Ksh. 0</p>
            </div>

            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="remainingDisplay">Ksh. 0</p>
            </div>
        </section>

        <section class="expense-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName"
                       placeholder="Expense name" required>

                <input type="number" id="expenseAmount"
                       placeholder="Amount (Ksh.)"
                       min="0.01" step="0.01" required>

                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="expense-section">
            <h2>Expense History</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseList">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWise. All Rights Reserved.</p>
    </footer>

</body>
</html>
